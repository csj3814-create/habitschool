<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해빛스쿨 - Google Play에서 받기</title>
    <meta name="description" content="식단·운동·수면을 매일 기록하고 함께 좋은 습관을 만드는 건강 습관 앱, 해빛스쿨.">
    <!-- 플레이스토어 주소를 카톡에 그대로 붙이면 구글이 정한 미리보기가 나오고 우리가
         바꿀 수 없다. 공유는 이 주소(/play)로 하고, 미리보기는 여기서 정한다.
         이미지는 scripts/generate_og_play.py 로 만든다. -->
    <link rel="canonical" href="https://habitschool.web.app/play">
    <meta property="og:type" content="website">
    <meta property="og:title" content="해빛스쿨 - 즐겁게 좋은 습관 만들기">
    <meta property="og:description" content="식단·운동·수면을 매일 기록하는 건강 습관 앱. Google Play에서 받아 보세요.">
    <meta property="og:image" content="https://habitschool.web.app/icons/og-play.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="https://habitschool.web.app/play">
    <meta property="og:site_name" content="해빛스쿨">
    <meta property="og:locale" content="ko_KR">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="해빛스쿨 - 즐겁게 좋은 습관 만들기">
    <meta name="twitter:description" content="식단·운동·수면을 매일 기록하는 건강 습관 앱">
    <meta name="twitter:image" content="https://habitschool.web.app/icons/og-play.png">
    <link rel="icon" href="/icons/app-icon-192.png">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #4A2808; background: linear-gradient(#FFF3D6, #FFD68C); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; text-align: center; }
        .box { max-width: 360px; width: 100%; }
        img { width: 112px; height: 112px; border-radius: 26px; box-shadow: 0 8px 24px rgba(180, 90, 0, .25); }
        h1 { font-size: 28px; margin: 20px 0 6px; }
        p { font-size: 15px; color: #6E4014; line-height: 1.6; }
        .btn { display: block; margin-top: 24px; padding: 15px; border-radius: 999px; background: #202124; color: #fff; font-size: 17px; font-weight: 700; text-decoration: none; }
        .sub { display: block; margin-top: 12px; padding: 13px; border-radius: 999px; background: rgba(255, 255, 255, .7); color: #4A2808; font-size: 15px; font-weight: 600; text-decoration: none; }
        .note { margin-top: 14px; font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <img src="/icons/app-icon-512.png" alt="해빛스쿨">
    <h1>해빛스쿨</h1>
    <p>식단 · 운동 · 수면 기록으로<br>즐겁게 좋은 습관 만들기</p>
    <a class="btn" id="store" href="https://play.google.com/store/apps/details?id=com.habitschool.app">Google Play에서 받기</a>
    <a class="sub" href="/">웹에서 바로 시작하기</a>
    <p class="note" id="ios-note" hidden>아이폰은 아직 앱이 없어요. 웹에서 똑같이 쓸 수 있어요.</p>
</div>
<script>
    // 안드로이드·PC는 바로 스토어로 넘긴다. 아이폰은 스토어에서 받을 수 없으니
    // 넘기지 않고 웹 시작 단추를 보여 준다.
    (function () {
        var ua = navigator.userAgent || '';
        if (/iPhone|iPad|iPod/i.test(ua)) {
            document.getElementById('ios-note').hidden = false;
            return;
        }
        location.replace(document.getElementById('store').href);
    })();
</script>
</body>
</html>
